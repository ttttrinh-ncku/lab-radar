name: weekly-update

# Friday 08:00 Asia/Taipei = Friday 00:00 UTC. Also runnable by hand (Actions tab → Run workflow).
on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/events.json", "template/**", "scope.json", "scripts/build.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lab-radar
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Collect repositories (scheduled / manual runs only)
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_repos.py

      - name: Validate data (fails the run on schema errors)
        run: python scripts/validate.py

      - name: Build pages
        run: python scripts/build.py

      - name: Commit updated data and logs
        if: github.event_name != 'push'
        run: |
          git config user.name "lab-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json data/logs site
          git diff --cached --quiet || git commit -m "weekly update $(date -u +%F)"
          git push

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
